# Forward modified keys (Shift+Enter, Ctrl+Enter, ...) to applications that ask
# for them, so agent TUIs running under the tmux wrapper keep their shortcuts.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys,alacritty*:extkeys'
# Alacritty supports true color; expose that to programs inside tmux.
set-environment -g COLORTERM truecolor

# Keep five lines of context between pages.
bind-key -n PPage copy-mode \; send-keys -FX -N '#{e|-:#{pane_height},5}' scroll-up

# Use copy mode as a fixed viewport: scrolling stays local, while other keys
# reach the pane. Input briefly exits copy mode, then restores its position.
set-option -s command-alias[100] keep-scrolled-input='set-option -pF @saved-scroll-position "#{scroll_position}" ; send-keys -X cancel ; send-keys ; copy-mode ; send-keys -FX -N "#{@saved-scroll-position}" scroll-up'
set-option -s command-alias[101] exit-scrolled-input='send-keys -X cancel ; send-keys'

unbind-key -a -T copy-mode
bind-key -T copy-mode PPage send-keys -FX -N '#{e|-:#{pane_height},5}' scroll-up
bind-key -T copy-mode NPage if-shell -F \
  '#{==:#{scroll_position},0}' \
  'send-keys -X cancel' \
  'send-keys -FX -N "#{e|-:#{pane_height},5}" scroll-down'
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode Any if-shell -F \
  '#{>:#{scroll_position},0}' \
  'keep-scrolled-input' \
  'exit-scrolled-input'
