# Where removable media shows up. Created at login by systemd-tmpfiles-setup.service.
#   ~/media/drives -> udev + systemd-mount put USB filesystems here
#   ~/media/mtp    -> mtp-automount puts phones and Kindles here
d  %h/media       0755 - - -
d  %h/media/mtp   0755 - - -
L+ %h/media/drives - - - - /run/media/%u
